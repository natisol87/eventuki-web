<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>EVENTUKI</title>
    <style>
        body { background: #0A0A14; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; }
        .controls { padding: 20px; display: flex; background: #13131F; }
        input { flex: 1; padding: 10px; background: #1A1A2E; color: white; border: none; }
        button { padding: 10px; background: #E8175D; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="controls">
        <input type="text" id="input" placeholder="¿Qué hacemos?">
        <button onclick="send()">Enviar</button>
    </div>
    <script>
        const API_URL = "https://natisol87-eventuki-api.hf.space";
        async function send() {
            const inp = document.getElementById('input');
            const chat = document.getElementById('chat');
            const text = inp.value;
            if(!text) return;
            chat.innerHTML += `<div><b>Vos:</b> ${text}</div>`;
            inp.value = '';
            try {
                const res = await fetch(API_URL + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                chat.innerHTML += `<div><b>Bot:</b> ${data.response}</div>`;
            } catch {
                chat.innerHTML += `<div>Error de conexión.</div>`;
            }
        }
    </script>
</body>
</html>
