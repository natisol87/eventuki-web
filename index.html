<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EVENTUKI — Eventos en Buenos Aires</title>
<style>
  :root {
    --pink:   #E8175D;
    --pink2:  #B01048;
    --gold:   #FFD535;
    --purple: #7B2FBE;
    --dark:   #0A0A14;
    --dark2:  #13131F;
    --dark3:  #1A1A2E;
    --text:   #F0EDF8;
    --text2:  rgba(240,237,248,.55);
    --border: rgba(232,23,93,.2);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--dark);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--dark2);
    border-bottom: 1px solid var(--border);
  }

  .logo { width: 38px; height: 38px; border-radius: 10px; }
  .header-info h1 { font-size: 1.1rem; color: #fff; }
  .header-info p { font-size: 0.75rem; color: var(--text2); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg { max-width: 85%; padding: 12px 16px; border-radius: var(--radius); line-height: 1.5; font-size: 0.95rem; }
  .bot { background: var(--dark3); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--purple); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

  .chat-input-area {
    padding: 16px 20px;
    background: var(--dark2);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }

  input {
    flex: 1;
    background: var(--dark3);
    border: 1px solid var(--border);
    color: white;
    padding: 12px 16px;
    border-radius: 25px;
    outline: none;
  }

  button {
    background: var(--pink);
    color: white;
    border: none;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<header>
  <img src="logo.png" class="logo" alt="logo">
  <div class="header-info">
    <h1>EVENTUKI</h1>
    <p>Guía de eventos en Buenos Aires</p>
  </div>
</header>

<div id="messages"></div>

<div class="chat-input-area">
  <input type="text" id="chat-input" placeholder="¿Qué hacemos hoy?">
  <button onclick="send()">➔</button>
</div>

<script>
  // URL de tu Space en Hugging Face
  const API_URL = "https://natisol87-eventuki-api.hf.space";

  async function send() {
    const inp = document.getElementById('chat-input');
    const msgArea = document.getElementById('messages');
    const text = inp.value.trim();
    if (!text) return;

    // Mostrar mensaje usuario
    msgArea.innerHTML += `<div class="msg user">${text}</div>`;
    inp.value = '';
    msgArea.scrollTop = msgArea.scrollHeight;

    try {
      const res = await fetch(API_URL + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      msgArea.innerHTML += `<div class="msg bot">${data.response}</div>`;
    } catch (e) {
      msgArea.innerHTML += `<div class="msg bot">Error conectando con el servidor. Revisá que el Space esté en "Running".</div>`;
    }
    msgArea.scrollTop = msgArea.scrollHeight;
  }
</script>
</body>
</html>
