<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EVENTUKI — Eventos en Buenos Aires</title>
<style>
  :root {
    --pink:   #E8175D;
    --pink2:  #B01048;
    --gold:   #FFD535;
    --purple: #7B2FBE;
    --dark:   #0A0A14;
    --dark2:  #13131F;
    --dark3:  #1A1A2E;
    --text:   #F0EDF8;
    --text2:  rgba(240,237,248,.55);
    --border: rgba(232,23,93,.2);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--dark);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: rgba(10,10,20,.9);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(20px);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .logo img {
    width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 0 !important;
    background: transparent !important;
  }

  .header-text h1 {
    font-size: 20px; font-weight: 800; letter-spacing: -.5px;
  }

  .header-text h1 span { color: var(--pink); }

  .header-text p {
    font-size: 11px; color: var(--text2); font-style: italic; margin-top: 1px;
  }

  .header-right {
    margin-left: auto;
    display: flex; gap: 8px;
  }

  .btn-tg {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid rgba(41,182,246,.3);
    background: rgba(41,182,246,.1);
    color: #29B6F6;
    font-size: 13px; font-weight: 600;
    text-decoration: none;
    transition: all .2s;
  }
  .btn-tg:hover { background: rgba(41,182,246,.2); }

  .btn-new {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-new:hover { border-color: var(--pink); color: var(--pink); }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: rgba(232,23,93,.3); border-radius: 2px; }

  .msg-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    animation: fadeUp .25s ease;
  }

  .msg-row.user { justify-content: flex-end; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 38px; height: 38px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }

  .avatar img {
    width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 0 !important;
    background: transparent !important;
  }

  .bubble-wrap { max-width: 78%; display: flex; flex-direction: column; gap: 8px; }

  .bubble {
    padding: 11px 15px;
    border-radius: 4px 16px 16px 16px;
    font-size: 14px; line-height: 1.6;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.09);
    color: var(--text);
  }

  .msg-row.user .bubble {
    background: linear-gradient(135deg, var(--pink), var(--pink2));
    border: none;
    border-radius: 16px 16px 4px 16px;
    color: #fff;
  }

  /* ── Event cards ── */
  .event-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(232,23,93,.22);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: border-color .2s, transform .2s;
  }
  .event-card:hover { border-color: rgba(232,23,93,.45); transform: translateY(-2px); }

  .card-title {
    font-size: 15px; font-weight: 700; margin-bottom: 10px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }

  .cat-badge {
    font-size: 11px; font-weight: 700; padding: 2px 9px;
    border-radius: 6px; background: rgba(123,47,190,.3); color: #C084FC;
    white-space: nowrap; flex-shrink: 0;
  }

  .card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 10px;
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 10px;
  }

  .card-grid span { color: var(--text); font-weight: 500; }

  .free-badge {
    display: inline-block; padding: 2px 9px; border-radius: 6px;
    font-size: 11px; font-weight: 700;
    background: rgba(0,200,81,.15); color: #00C851;
  }

  .price-badge {
    display: inline-block; padding: 2px 9px; border-radius: 6px;
    font-size: 11px; font-weight: 700;
    background: rgba(255,213,53,.12); color: var(--gold);
  }

  .card-desc {
    font-size: 12px; color: var(--text2); line-height: 1.5;
    margin-bottom: 10px;
  }

  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn-ticket {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 14px; border-radius: 20px; border: none; cursor: pointer;
    font-size: 12px; font-weight: 700;
    background: linear-gradient(135deg, var(--pink), var(--pink2));
    color: #fff; text-decoration: none;
    transition: all .2s;
  }
  .btn-ticket:hover { box-shadow: 0 0 16px rgba(232,23,93,.5); transform: scale(1.03); }

  .btn-cal {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 14px; border-radius: 20px;
    border: 1px solid rgba(0,200,81,.35); cursor: pointer;
    font-size: 12px; font-weight: 700;
    background: rgba(0,200,81,.1); color: #00C851;
    text-decoration: none; transition: all .2s;
  }
  .btn-cal:hover { background: rgba(0,200,81,.2); }

  /* ── Quick buttons ── */
  .quick-btns {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 0 16px 8px;
    max-width: 780px; width: 100%; margin: 0 auto;
  }

  .quick-btn {
    padding: 7px 14px; border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(232,23,93,.08);
    color: var(--text2); font-size: 13px; cursor: pointer;
    transition: all .2s;
  }
  .quick-btn:hover { border-color: var(--pink); color: var(--text); background: rgba(232,23,93,.15); }

  /* ── Input ── */
  .input-area {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    background: rgba(10,10,20,.85);
    backdrop-filter: blur(20px);
    flex-shrink: 0;
    max-width: 780px; width: 100%; margin: 0 auto;
  }

  .input-row {
    display: flex; gap: 10px;
  }

  #chat-input {
    flex: 1;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(232,23,93,.3);
    border-radius: 24px;
    color: var(--text);
    padding: 11px 18px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  #chat-input:focus { border-color: var(--pink); }
  #chat-input::placeholder { color: var(--text2); }

  #send-btn {
    padding: 11px 22px; border-radius: 24px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--pink), var(--pink2));
    color: #fff; font-size: 14px; font-weight: 700;
    transition: all .2s; flex-shrink: 0;
  }
  #send-btn:hover:not(:disabled) { box-shadow: 0 0 20px rgba(232,23,93,.45); transform: scale(1.03); }
  #send-btn:disabled { opacity: .5; cursor: not-allowed; }

  .input-hint {
    text-align: center; font-size: 11px; color: var(--text2); margin-top: 8px;
  }

  /* ── Typing indicator ── */
  .typing { display: flex; gap: 4px; align-items: center; padding: 12px 16px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--pink);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%,80%,100% { opacity:.3; transform:scale(.8); }
    40%         { opacity:1;  transform:scale(1); }
  }

  /* ── Config notice ── */
  #config-notice {
    position: fixed; inset: 0; background: rgba(10,10,20,.95);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .config-box {
    background: var(--dark2); border: 1px solid var(--border);
    border-radius: 20px; padding: 30px; max-width: 480px; width: 100%;
    text-align: center;
  }
  .config-box h2 { font-size: 22px; margin-bottom: 10px; }
  .config-box h2 span { color: var(--pink); }
  .config-box p { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 20px; }
  .config-box input {
    width: 100%;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text); padding: 10px 14px;
    font-size: 14px; outline: none; margin-bottom: 14px;
    transition: border-color .2s;
  }
  .config-box input:focus { border-color: var(--pink); }
  .config-box button {
    width: 100%; padding: 12px; border-radius: 12px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--pink), var(--pink2));
    color: #fff; font-size: 15px; font-weight: 700;
    transition: all .2s;
  }
  .config-box button:hover { box-shadow: 0 0 20px rgba(232,23,93,.4); }
  .config-box .hint { font-size: 12px; color: var(--text2); margin-top: 12px; }

  @media (max-width: 600px) {
    header { padding: 10px 14px; }
    .header-text h1 { font-size: 17px; }
    .btn-tg span { display: none; }
    #messages { padding: 14px 12px; }
    .bubble-wrap { max-width: 88%; }
    .card-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const SESSION_ID = 'sess_' + Math.random().toString(36).slice(2);
let API_URL = localStorage.getItem('eventuki_api_url') || '';

async function saveApiUrl() {
  const val = document.getElementById('api-url-input').value.trim().replace(/\/$/, '');
  if (!val.startsWith('http')) { alert('Ingresá una URL válida (https://...)'); return; }
  const btn = document.querySelector('.config-box button');
  btn.textContent = 'Verificando conexión...'; btn.disabled = true;
  try {
    const r = await fetch(val + '/health', {signal: AbortSignal.timeout(15000)});
    if (!r.ok) throw new Error('status ' + r.status);
    localStorage.setItem('eventuki_api_url', val);
    API_URL = val;
    document.getElementById('config-notice').style.display = 'none';
    document.getElementById('api-indicator').textContent = new URL(val).hostname;
    showWelcome();
  } catch(e) {
    btn.textContent = 'Conectar y verificar'; btn.disabled = false;
    const hint = document.querySelector('.config-box .hint');
    hint.innerHTML = '<span style="color:#ff6b6b">⚠️ No se pudo conectar. Verificá que el Space esté corriendo y la URL sea correcta.<br>Si recién lo creaste, esperá 2-3 minutos y volvé a intentar.</span>';
  }
}

// Si ya hay URL guardada, ocultar modal
if (API_URL) {
  document.getElementById('config-notice').style.display = 'none';
  document.getElementById('api-indicator').textContent = new URL(API_URL).hostname;
}

// ── Calendar URL ──────────────────────────────────────────────────────────────
function calUrl(ev) {
  const h   = (ev.hora || '20:00').replace(':','').padEnd(6,'0').slice(0,6);
  const hh  = String((parseInt(h.slice(0,2))+2)%24).padStart(2,'0');
  const end = hh + h.slice(2,4) + '00';
  const p   = new URLSearchParams({
    action: 'TEMPLATE', text: ev.nombre || 'Evento EVENTUKI',
    dates:  `20260517T${h}/20260517T${end}`,
    details: [ev.descripcion, ev.entradas_url ? 'Entradas: '+ev.entradas_url : '', ev.precio ? 'Precio: '+ev.precio : ''].filter(Boolean).join('\n\n'),
    location: ev.direccion || ev.venue || '',
  });
  return 'https://calendar.google.com/calendar/render?' + p;
}

// ── Render helpers ────────────────────────────────────────────────────────────
function isFree(precio) {
  return /gratu|gratis|free/i.test(precio || '');
}

function renderCard(ev) {
  const nombre = ev.nombre || 'Evento';
  const venue  = ev.venue  || ev.direccion || 'A confirmar';
  const fecha  = ev.fecha  || 'A confirmar';
  const hora   = ev.hora   || '';
  const precio = ev.precio || 'A confirmar';
  const url    = ev.entradas_url || '';
  const cat    = ev.categoria || '';
  const desc   = ev.descripcion || '';
  const gratis = isFree(precio);

  const priceBadge = gratis
    ? '<span class="free-badge">✨ GRATIS</span>'
    : `<span class="price-badge">💰 ${precio}</span>`;

  const ticketBtn = url
    ? `<a href="${url}" target="_blank" rel="noopener" class="btn-ticket">🎟 Comprar entradas</a>`
    : '';

  return `
    <div class="event-card">
      <div class="card-title">
        <span>${nombre}</span>
        <span class="cat-badge">${cat}</span>
      </div>
      <div class="card-grid">
        <div>🎯 <span>Qué:</span>    ${nombre}</div>
        <div>📍 <span>Dónde:</span>  ${venue}</div>
        <div>📅 <span>Cuándo:</span> ${(fecha + ' ' + hora).trim()}</div>
        <div>${priceBadge}</div>
      </div>
      ${desc ? `<div class="card-desc">${desc}</div>` : ''}
      <div class="card-actions">
        ${ticketBtn}
        <a href="${calUrl(ev)}" target="_blank" rel="noopener" class="btn-cal">📅 Google Calendar</a>
      </div>
    </div>`;
}

function renderBubble(text, role) {
  const div = document.createElement('div');

function removeTyping() {
  document.getElementById('typing-row')?.remove();
}

// ── API call ──────────────────────────────────────────────────────────────────
async function callAPI(message) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 30000);
  const resp = await fetch(API_URL + '/chat', {
    method:  'POST',
    headers: {'Content-Type': 'application/json'},
    body:    JSON.stringify({session_id: SESSION_ID, message}),
    signal:  controller.signal,
  });
  clearTimeout(timeout);
  if (!resp.ok) throw new Error('Error ' + resp.status);
  return resp.json();
}

// ── Send ──────────────────────────────────────────────────────────────────────
async function send() {
  const inp  = document.getElementById('chat-input');
  const btn  = document.getElementById('send-btn');
  const text = inp.value.trim();
  if (!text || btn.disabled) return;
  if (!API_URL) { document.getElementById('config-notice').style.display = 'flex'; return; }

  addMessage(text, 'user', []);
  inp.value = ''; inp.disabled = true; btn.disabled = true;
  document.getElementById('quick-btns').style.display = 'none';
  showTyping();

  try {
    const data = await callAPI(text);
    removeTyping();
    addMessage(data.text, 'bot', data.events || []);
  } catch (e) {
    removeTyping();
    const isTimeout = e.name === 'AbortError';
    const msg = isTimeout
      ? 'El servidor tardó demasiado en responder. Es normal en el primer mensaje — el Space de HuggingFace necesita ~30 segundos para arrancar en frío. \n\nEsperá unos segundos y volvé a intentar. 🔄'
      : 'Problema conectando con el servidor. Verificá que el Space esté corriendo en HuggingFace. \n\nURL configurada: ' + API_URL;
    addMessage(msg, 'bot', []);
    console.error('API error:', e);
  }

  inp.disabled = false; btn.disabled = false; inp.focus();
}

function quickSend(text) {
  document.getElementById('chat-input').value = text;
  send();
}

// ── New chat ──────────────────────────────────────────────────────────────────
async function newChat() {
  if (API_URL) {
    try { await fetch(API_URL + '/chat/' + SESSION_ID, {method:'DELETE'}); } catch(e){}
  }
  document.getElementById('messages').innerHTML = '';
  document.getElementById('quick-btns').style.display = 'flex';
  showWelcome();
}

// ── Welcome message ───────────────────────────────────────────────────────────
function showWelcome() {
  addMessage(
    'Buenas! Soy EVENTUKI, tu guía de eventos en Buenos Aires. 🎉\n\n' +
    '"Si la ciudad no duerme, su agenda tampoco."\n\n' +
    'Contame qué buscás: qué tipo de evento, qué día y a qué hora.',
    'bot', []
  );
}

// ── Init ──────────────────────────────────────────────────────────────────────
if (API_URL) showWelcome();
</script>
